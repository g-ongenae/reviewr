name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      # Real PostgreSQL for apps/api/test/concurrency.pg.spec.ts (the other tests run on PGlite).
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          # Fail instead of skipping the PostgreSQL tests if the URL goes missing.
          REQUIRE_TEST_DATABASE: '1'

  hermes:
    # The merge package's specs on the Hermes VM that React Native 0.88 ships (see packages/merge/README.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @reviewr/merge
      # The VM links the system ICU: a new Ubuntu release (ImageOS, e.g. ubuntu24) gets a new build.
      - id: image
        run: echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v4
        with:
          path: packages/merge/.hermes/260318099.0.4/bin
          key: hermes-${{ steps.image.outputs.os }}-${{ hashFiles('packages/merge/hermes/get-hermes.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get install -y --no-install-recommends ninja-build libicu-dev
      # A no-op when the cache has the binaries.
      - run: packages/merge/hermes/get-hermes.sh
      # Fails if a case fails on Hermes, or if the binaries are missing.
      - run: pnpm --filter @reviewr/merge test:hermes
