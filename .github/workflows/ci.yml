name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      # Real PostgreSQL for apps/api/test/concurrency.pg.spec.ts (the other tests run on PGlite).
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          # Fail instead of skipping the PostgreSQL tests if the URL goes missing.
          REQUIRE_TEST_DATABASE: '1'
