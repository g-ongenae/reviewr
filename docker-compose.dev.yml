services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: reviewr
      POSTGRES_PASSWORD: reviewr
      POSTGRES_DB: reviewr
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - devpgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reviewr -d reviewr']
      interval: 5s
      retries: 10
volumes:
  devpgdata:
